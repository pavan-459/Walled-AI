[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "0.1.0"
description = "Approve or block every MCP request made by Claude Desktop and Claude (web) connectors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
demo = ["mcp>=1.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mcp>=1.10"]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.setuptools]
packages = ["mcp_guard", "mcp_guard.ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B027", "B905"]
